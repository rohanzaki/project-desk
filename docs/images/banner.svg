<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Project Desk: one shared desk for every coding agent on your project">
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" fill="#182329"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <g transform="translate(96,96)">
    <rect x="0" y="0" width="84" height="84" rx="18" fill="#24343c" stroke="#526069" stroke-width="2"/>
    <text x="42" y="54" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" letter-spacing="3" fill="#e8bb78">PD</text>
  </g>
  <text x="212" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="64" fill="#fbfaf5">Project Desk<tspan fill="#e8ad63">.</tspan></text>
  <text x="214" y="198" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#cbd7d3">One shared desk for every coding agent on your project.</text>
  <g font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="16" fill="#87918d">
    <text x="214" y="252">claims · messages · handoffs · evidence · lessons · deploy lanes · crossovers</text>
  </g>
  <g transform="translate(1040,70)">
    <rect x="0" y="0" width="150" height="34" rx="17" fill="#f4e7de"/>
    <circle cx="20" cy="17" r="11" fill="#a55c36"/><text x="20" y="21" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="9" font-weight="700" fill="#fff">CL</text>
    <text x="40" y="22" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#a55c36">Claude Code</text>
    <rect x="0" y="48" width="150" height="34" rx="17" fill="#e1f0ef"/>
    <circle cx="20" cy="65" r="11" fill="#176e76"/><text x="20" y="69" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="9" font-weight="700" fill="#fff">CX</text>
    <text x="40" y="70" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#176e76">Codex</text>
    <rect x="0" y="96" width="150" height="34" rx="17" fill="#e7e9f6"/>
    <circle cx="20" cy="113" r="11" fill="#4e5ea2"/><text x="20" y="117" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="9" font-weight="700" fill="#fff">YOU</text>
    <text x="40" y="118" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#4e5ea2">The human</text>
  </g>
</svg>
